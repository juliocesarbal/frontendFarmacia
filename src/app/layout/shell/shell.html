<!-- TOPBAR institucional -->
<div class="topbar">
  <div class="brand">
    <img src="logo-hospital.png" alt="Logo HEV" class="brand-logo" />
    <div class="brand-text">
      <span class="brand-name">Farmacia HEV</span>
      <span class="brand-sub">Hospital Escuela Veterinaria · UAGRM</span>
    </div>
  </div>

  <div class="ms-auto d-flex align-items-center">
    <div class="dropdown">
      <button class="user-pill" data-bs-toggle="dropdown" title="Cuenta">
        <span class="avatar">{{ iniciales() }}</span>
        <span class="user-info d-none d-md-flex">
          <span class="name">{{ usuario()?.first_name || usuario()?.username }}</span>
          <span class="role">{{ rolNombre() }}</span>
        </span>
        <i class="bi bi-chevron-down ms-1"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><span class="dropdown-item-text small text-muted">{{ usuario()?.correo }}</span></li>
        <li><hr class="dropdown-divider" /></li>
        <li><button class="dropdown-item" (click)="salir()"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesion</button></li>
      </ul>
    </div>
  </div>
</div>

<div class="d-flex shell-body">
  <!-- Sidebar -->
  <aside class="sidebar">
    <nav class="px-2 py-2">
      <div class="nav-heading">Navegacion</div>
      @for (g of grupos(); track g.nombre) {
        <div class="grupo-label">{{ g.nombre }}</div>
        @for (item of g.items; track item.ruta) {
          <a
            class="nav-link d-flex align-items-center gap-2"
            [routerLink]="item.ruta"
            routerLinkActive="active"
          >
            <i class="bi" [class]="item.icono"></i>
            <span>{{ item.texto }}</span>
          </a>
        }
      }
    </nav>
  </aside>

  <!-- Contenido -->
  <main class="content flex-grow-1 p-4">
    <router-outlet></router-outlet>
  </main>
</div>
